spring.application.name=rental-management

# ──────────────────────────────────────────────────────────────
# Database Configuration
# createDatabaseIfNotExist=true  → MySQL creates rental_db automatically
# No need to run init.sql or any SQL script!
# ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/rental_db
spring.datasource.username=root
spring.datasource.password=Sai@9000839260
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────────────────────
# JPA Configuration
# ddl-auto=update → Hibernate auto-creates all tables on startup
# No need to run any SQL manually!
# ──────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwt.secret=rental-management-secret-key-2024-very-long-secret-key-for-security
app.jwt.expiration=86400000

# Server Port
server.port=8080

# CORS
spring.web.cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.rental=DEBUG
